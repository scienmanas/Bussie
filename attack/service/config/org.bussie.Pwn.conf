<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Only root may own the name. -->
  <policy user="root">
    <allow own="org.bussie.Pwn"/>
    <allow send_destination="org.bussie.Pwn"/>
  </policy>

  <!-- Deliberately permissive: any local user may invoke any method
       on org.bussie.Pwn. This is the bug class the demo exists to
       illustrate. Remove this <policy context="default"> block (or
       restrict it to a specific user/group) and the attack dies at
       the bus with AccessDenied. -->
  <policy context="default">
    <allow send_destination="org.bussie.Pwn"/>
    <allow send_interface="org.bussie.Pwn"/>
  </policy>
</busconfig>
